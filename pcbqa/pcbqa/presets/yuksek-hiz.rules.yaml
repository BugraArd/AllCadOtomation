# Yuksek hizli ve hassas sinyaller - yerlesim kurallari
#
# Kaynak: docs/tasarim-kurallari/03-yuksek-hiz-sinyal.md
#
# BU DOSYADAKI ESIKLERIN KAYNAK KALITESI ESIT DEGIL - her kuralin ustunde
# yaziyor. Ozellikle KRISTAL mesafesi icin hicbir uretici (ST, Microchip, NXP,
# Silabs) mm vermiyor; dolasan "5 mm / 10 mm" degerlerinin birincil kaynagi yok.

version: 1

defaults:
  severity: warning
  ignore_nets: ["GND", "AGND", "DGND", "/GND"]

rules:
  # --- Decoupling ---------------------------------------------------------
  # TI SBAA113: < 0.25 inc = 6.35 mm. Kaynakli TEK sabit ust sinir.
  # Bloglardaki "1-2 mm" degerinin birincil kaynagi YOK.
  #
  # Frekans bagimli dogru esik lambda/40 (Xilinx UG483):
  #   100 MHz -> 38 mm | 500 MHz -> 7.6 mm | 1 GHz -> 3.8 mm | 2 GHz -> 1.9 mm
  # Kondansatorun MONTAJLI rezonans frekansini biliyorsaniz asagidaki 6.35'i
  # pcbqa.ipc2221.decoupling_max_distance_mm() ile hesaplayip degistirin.
  - id: hs-decoupling-mesafesi
    type: proximity
    severity: error
    description: "Her IC guc pininin yakininda kendi decoupling kondansatoru olmali (TI SBAA113: < 6.35 mm)"
    weight: 12   # TI SBAA113: kaynakli TEK sabit ust sinir (< 6.35 mm)
    pin:
      kind: ic
      pintype: power_in
    partner:
      kind: capacitor
    max_distance_mm: 6.35
    require_partner: true
    exclusive: true

  # --- Kristal ------------------------------------------------------------
  # Kristal -> MCU mesafesi icin sayisal esik BULUNAMADI, o yuzden burada
  # kural yok. Bunun yerine kaynakli olan ayrim kurallari var:
  #
  # Microchip AN15.17: kristal izleri diger izlerden 5 x iz genisligi uzakta.
  # TI SPRAAR7E: saat/periyodik sinyal <-> diger sinyaller >= 1.27 mm.
  - id: hs-kristal-yuk-kondansatoru
    type: proximity
    description: "Kristalin yuk kondansatorleri kristale yakin olmali (kaynak niteliksel: 'close to each other')"
    weight: 4   # kaynak NITEL ('close to each other'); 5 mm bizim sayilastirmamiz
    pin:
      kind: crystal
    partner:
      kind: capacitor
    max_distance_mm: 5.0
    require_partner: false

  # ST AN2867 / TI SPRAAR7E: anahtarlamali regulator kristalden uzak tutulur.
  # Sayisal degeri YOK; buradaki 15 mm bir MUHENDISLIK SECIMI, kaynak degil.
  - id: hs-kristal-regulatorden-uzak
    type: keep_apart
    description: "Kristal anahtarlamali regulatorden uzak olmali (SAYISAL KAYNAK YOK - secim)"
    weight: 2   # MUHENDISLIK SECIMI - kaynakta sayi YOK
    a:
      kind: crystal
    b:
      kind: inductor
    min_distance_mm: 15.0

  # --- I2C ----------------------------------------------------------------
  # NXP UM10204: bus kapasitansi <= 400 pF. Pull-up KONUMU icin normatif
  # kural YOK - spesifikasyon konum belirtmiyor.
  - id: hs-i2c-pullup
    type: require_on_net
    description: "I2C hatlarinda pull-up direnci bekleniyor (NXP UM10204)"
    weight: 12   # NXP UM10204; yoksa bus calismaz - islevsel kritiklik yuksek
    net: "(SDA|SCL|I2C)"
    partner:
      kind: resistor

  # --- Diferansiyel ciftler ----------------------------------------------
  # USB 2.0 intra-pair: kaynaklar 2 / 50 / 100 / 150 mil veriyor (75 kat
  # yayilim, TI kendi icinde tutarsiz). 50 mil = 1.27 mm en savunulabilir
  # olan: 480 Mbps'de UI'nin %0.4'u.
  - id: hs-usb-cift-eslestirme
    type: length_match
    severity: error
    description: "USB D+/D- uzunluk eslestirmesi (TI SPRAAR7E: 50 mil = 1.27 mm MAX)"
    weight: 8   # TI SPRAAR7E 50 mil, ama kaynaklar arasi 75 KAT yayilim var (2/50/100/150 mil) - belirsizlik agirligi dusuruyor
    groups:
      - ["USB_DP", "USB_DM"]
      - ["D+", "D-"]
    tolerance_mm: 1.27

  # Microchip DS00002054A: Ethernet intra-pair 50 mil, inter-pair 600 mil.
  - id: hs-ethernet-cift-eslestirme
    type: length_match
    severity: error
    description: "Ethernet MDI cift ici eslestirme (Microchip: 50 mil = 1.27 mm)"
    weight: 10   # Microchip DS00002054A: net sayisal (50 mil), celiski az
    groups:
      - ["TRD0_P", "TRD0_N"]
      - ["TRD1_P", "TRD1_N"]
    tolerance_mm: 1.27

  # Microchip DS00002054A: PHY <-> magnetics < 1 inc, toplam < 4 inc.
  - id: hs-usb-net-uzunlugu
    type: net_length
    description: "USB 2.0 toplam iz uzunlugu (TI SPRAAR7E: max 12000 mil = 305 mm)"
    weight: 8   # TI SPRAAR7E MAX degeri (12000 mil)
    net: "(USB_D|D\\+|D-)"
    max_hpwl_mm: 305.0

  # --- Bilesen DEGERI (KAPALI - beyan gerektirir) ---------------------------
  # Bu kurallar tasarim dosyasinda OLMAYAN bilgi ister. Varsayilan uydurmak
  # yanlis guven verirdi, o yuzden kapalilar - kendi degerlerinizi girip acin.
  #
  # I2C pull-up (NXP UM10204 7.1):
  #   Rp(max) = tr / (0.8473 * Cb)      yukselme suresi butcesi
  #   Rp(min) = (VDD - VOL) / IOL       surucunun cekebilecegi akim
  #
  # bus_capacitance_pf'yi kendiniz kestirmelisiniz: cihaz basina <= 10 pF
  # (UM10204 Tablo 10) + iz kapasitansi (~0.5-1.5 pF/cm) + konnektor.
  #
  # DIKKAT: 200 pF ustunde duz direnc YETMEZ; UM10204 akim kaynagi ya da
  # anahtarlamali direnc devresi ister. Kural o durumda "kabul araligi BOS"
  # diye bildirir - bu gercek bir bulgudur, sessizce gecilmez.
  #
  # - id: hs-i2c-pullup-degeri
  #   type: component_value
  #   severity: warning
  #   description: "I2C pull-up degeri bus kapasitansina uymali (NXP UM10204)"
  #   weight: 12
  #   select: { kind: resistor }
  #   on_net: "(SDA|SCL)"
  #   check: i2c_pullup
  #   params:
  #     vdd: 3.3
  #     bus_capacitance_pf: 150
  #     mode: fast              # standard | fast | fast_plus
  #
  # Kristal yuk kondansatoru (Microchip AN826):
  #   CL = C/2 + Cstray  ->  C = 2 * (CL - Cstray),  stray 2-5 pF
  # cl_pf kristalin datasheet degeridir; kondansatorun degeri DEGILDIR.
  #
  # - id: hs-kristal-yuk-degeri
  #   type: component_value
  #   severity: warning
  #   description: "Kristal yuk kondansatoru CL'ye uymali (Microchip AN826)"
  #   weight: 8
  #   select: { kind: capacitor }
  #   on_net: "(XTAL|OSC)"
  #   check: crystal_load
  #   params:
  #     cl_pf: 12               # kristalin datasheet CL degeri

# ---------------------------------------------------------------------------
# BU MOTORLA OLCULEMEYENLER
#
#   - 5W kurali (diff ciftler arasi >= 5 x iz genisligi). Yonlendirme
#     geometrisi uzerinden iz-iz mesafesi gerektirir; clearance_voltage'in
#     altyapisi var ama kural "ayni netten olmayan HER iz cifti" olarak
#     kurulmali - buyuk kartlarda pahali.
#   - Stub uzunlugu (USB: 0 adet, kacinilmazsa < 5.08 mm) - iz topolojisi
#     analizi gerektirir.
#   - Via stub / backdrill (< 0.381 mm) - katman yigini bilgisi gerektirir.
#   - Referans duzlem surekliligi (TI SPRAAR7E) - zone okuma gerektirir.
#   - lambda/40: kondansatorun montajli rezonans frekansi BOM'da yok.
#   - Bus kapasitansinin KENDISI: cihaz sayisi ve iz uzunlugundan tahmin
#     edilebilir ama olculemez; component_value kurali beyan istiyor.
# ---------------------------------------------------------------------------
