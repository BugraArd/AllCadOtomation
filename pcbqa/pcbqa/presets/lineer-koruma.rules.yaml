# LDO, motor surucu, ESD korumasi, sensor - yerlesim kurallari
#
# Kaynak: docs/tasarim-kurallari/04-lineer-motor-koruma.md
#
# ONEMLI BULGU: LDO app-note'larinin HICBIRI (TI, ADI, MaxLinear) giris/cikis
# kondansatoru icin mm vermiyor - hepsi "as close as practical" diyor.
# Buradaki 5 mm, TI'in motor surucu (SLVA959B) ve sicaklik sensoru (SNOA986A)
# notlarindan gelen genel IC bypass kuralidir.

version: 1

defaults:
  severity: warning
  ignore_nets: ["GND", "AGND", "DGND", "PGND", "/GND"]

rules:
  # --- LDO / lineer regulator ---------------------------------------------
  # TI SLVA959B 5.3.1: "less than 0.5 cm (0.2 in)". 2-3 mm hedefleyin.
  - id: ldo-giris-kondansatoru
    type: proximity
    severity: error
    description: "LDO giris kondansatoru VIN pinine yakin olmali (TI: < 5 mm)"
    weight: 6   # NITEL kaynak sayilastirildi: LDO app-note'lari mm VERMIYOR, 5 mm TI SLVA959B'nin genel bypass kuralindan
    pin:
      kind: ic
      function: "^(VIN|IN|VI)$"
    partner:
      kind: capacitor
    max_distance_mm: 5.0
    require_partner: true

  - id: ldo-cikis-kondansatoru
    type: proximity
    severity: error
    description: "LDO cikis kondansatoru VOUT pinine yakin olmali (TI: < 5 mm)"
    weight: 6   # ayni - nitel kaynak sayilastirildi
    pin:
      kind: ic
      function: "^(VOUT|OUT|VO)$"
    partner:
      kind: capacitor
    max_distance_mm: 5.0
    require_partner: false

  # --- Motor surucu / gate driver -----------------------------------------
  # TI SLVA959B 4: gate izi >= 20 mil (0.508 mm) @ 1 oz.
  - id: motor-gate-izi-genisligi
    type: trace_width
    description: "Gate izleri yeterince genis olmali (TI SLVA959B: >= 0.508 mm @ 1 oz)"
    weight: 10   # TI SLVA959B 4 (sayisal, 20 mil) - genislik surekli, olceklenir
    scale: true
    net: "^(GATE|GH|GL|HG|LG|G[0-9])"
    current_a: 0.001
    min_width_mm: 0.508

  # TI SNVA021C 5: yuksek akim izi >= 15 mil/A = 0.381 mm/A mutlak minimum.
  # Bu, IPC-2221'in 1 A/10 C degerinden (0.30 mm) daha sikidir.
  - id: motor-guc-izi
    type: trace_width
    severity: error
    description: "Motor guc izleri (TI SNVA021C: >= 0.381 mm/A mutlak minimum)"
    weight: 14   # TI SNVA021C 5: 0.381 mm/A MUTLAK minimum - surekli, olceklenir
    scale: true
    net: "^(VM|VBAT|MOTOR|OUT[AB]|M[12])"
    current_a: 1.0
    min_width_mm: 0.381

  - id: motor-bypass-kondansatoru
    type: proximity
    severity: error
    description: "Motor surucu bypass kondansatoru besleme pinine yakin (TI: < 5 mm)"
    weight: 10   # TI SLVA959B 5.3.1 (sayisal: < 0.5 cm)
    pin:
      kind: ic
      ref: "^U"
      pintype: power_in
    partner:
      kind: capacitor
    max_distance_mm: 5.0
    require_partner: true

  # --- ESD / TVS ----------------------------------------------------------
  # TI SLVA680A: TVS konnektore "immediately next to" olmali. Sayisal degeri
  # ikincil (blog) kaynakli: < 5 mm.
  #
  # ASIL BUYUKLUK MESAFE DEGIL ENDUKTANS: ROHM 66AN067E, 50 mm x 0.5 mm bir
  # izin 52 nH tasidigini ve 8 kV'ta TVS'i TAMAMEN islevsiz biraktigini
  # (ilk tepe 3.4 kV) olcmus. ~1 nH ile ayni tepe 107 V. Mesafe esigi bunun
  # yalnizca kaba bir vekilidir.
  - id: esd-tvs-konnektore-yakin
    type: proximity
    severity: error
    description: "TVS/ESD korumasi konnektore bitisik olmali (TI SLVA680A; sayi ikincil kaynak)"
    weight: 14   # onemi OLCULMUS (ROHM 66AN067E: 52 nH -> TVS islevsiz, 3.4 kV vs 107 V) ama 5 mm esigi IKINCIL kaynak
    pin:
      kind: connector
    partner:
      kind: diode
      ref: "^(D|TVS|ESD)"
    max_distance_mm: 5.0
    require_partner: false

  # --- Sicaklik sensoru ---------------------------------------------------
  # TI SNOA986A 3: sayisal deger veren NADIR kaynak.
  #   0.1 uF bypass -> sensor  <= 5 mm  (garanti sarti)
  #   I2C pull-up   -> sensor  >= 10 mm (direnclerin oz-isinmasi olcumu bozar)
  - id: sensor-bypass-kondansatoru
    type: proximity
    severity: error
    description: "Sicaklik sensorunun bypass kondansatoru <= 5 mm (TI SNOA986A)"
    weight: 12   # TI SNOA986A 3: garanti sarti olarak sayisal (<= 5 mm)
    pin:
      kind: ic
      ref: "^(U|TMP|IC)"
      pintype: power_in
    partner:
      kind: capacitor
    max_distance_mm: 5.0
    require_partner: false

  # DIKKAT: bu kural "yaklastir" degil "UZAKLASTIR" der. Yerlestirici
  # yalnizca HPWL kucultmeye calisirsa bunu ihlal eder.
  - id: sensor-pullup-uzak-dursun
    type: keep_apart
    severity: error
    description: "I2C pull-up direncleri sicaklik sensorunden >= 10 mm (TI SNOA986A: oz-isinma)"
    weight: 12   # TI SNOA986A 3: sayisal (>= 10 mm), oz-isinma olcumu bozuyor
    a:
      kind: resistor
    b:
      kind: ic
      ref: "^(TMP|TEMP|LM7[45])"
    min_distance_mm: 10.0

  # --- Manyetik sensor ----------------------------------------------------
  # NXP AN4247: B(r) = 0.2e-6 * I / r [T]. 1 A izden 10 mm'de 20 uT kalir.
  # 0.5 uT hedefi 400 mm gerektirir - fiziksel olarak imkansiz, yazilim
  # kalibrasyonu ZORUNLU. Buradaki 10 mm makul bir alt siniridir, cozum degil.
  - id: manyetik-sensor-guc-izinden-uzak
    type: keep_apart
    description: "Manyetometre/IMU guc bilesenlerinden >= 10 mm (NXP AN4247; kalibrasyon yine de sart)"
    weight: 4   # HESAP (NXP AN4247 formulunden); kaynak zaten yerlesimle cozulemeyecegini soyluyor
    a:
      kind: ic
      ref: "^(IMU|MAG|LSM|MPU|BM[IX])"
    b:
      kind: inductor
    min_distance_mm: 10.0

  # --- Termal bakir alani (KAPALI - beyan gerektirir) -----------------------
  # Richtek AN044, SOT-223 icin OLCULMUS theta-JA egrisi:
  #    16 mm2 -> 135 C/W | 100 mm2 -> 107 C/W | 2500 mm2 -> 50 C/W
  #
  # HESAP (dokuman 4.2): TA=25 C ve TJ<=125 C ise 1 W icin ~1.2-1.5 cm2 yeter;
  # ama TA=70 C'de ayni 1 W icin ~20-22 cm2 gerekir. Yani esik ORTAMA ve GUC
  # DISSIPASYONUNA baglidir ve ikisi de tasarim dosyasinda yoktur.
  #
  # Bu yuzden kural KAPALI: min_mm2'yi uydurmak yanlis guven verirdi. Kendi
  # tasariminizin dissipasyonunu hesaplayip acin.
  #
  # DIKKAT: alan olcumu FAZLA TAHMINDIR (ustuste binen bakir iki kez sayilir).
  # Ust sinirda bu guvenli yondedir ama ALT sinirda DEGILDIR - yetersiz bakiri
  # yeterli gosterebilir. Buraya pay birakin.
  #
  # - id: termal-bakir-alani
  #   type: copper_area
  #   severity: warning
  #   description: "Regulator cikisinda termal bakir alani yeterli olmali (Richtek AN044)"
  #   weight: 10
  #   net: "^(VOUT|VO|3V3|5V)$"
  #   min_mm2: 2000        # ~20 cm2: 1 W @ TA=70 C, TJ<=125 C

# ---------------------------------------------------------------------------
# BU MOTORLA OLCULEMEYENLER
#
#   - ESD izi ENDUKTANSI (asil buyukluk). Iz uzunlugu x genislik gerektirir;
#     Track verisi var, ama "konnektorden TVS'e giden yol" topoloji analizi
#     ister.
#   - TVS stub uzunlugu (0 mm - yasak). Iz topolojisi.
#   - Sense direnci Kelvin baglantisi (TI SLVA959B 7.6) - diferansiyel cift
#     rotasi kontrolu.
#   - Termal bakir alani: zone okuma EKLENDI, kural artik yazilabilir (asagida
#     kapali ornek). Ama esik guc dissipasyonuna baglidir ve o bilgi tasarim
#     dosyasinda YOKTUR - kullanicinin beyan etmesi gerekir.
#   - Elektrolitik vent ustu bosluk (Nichicon: 2/3/5 mm cape gore) - 3B
#     yukseklik bilgisi gerektirir.
#   - Creepage slot genisligi (IEC 60664-1: PD1 0.25 / PD2 1.0 / PD3 1.5 mm) -
#     kart kesikleri (Edge.Cuts ic hatlari) okunmuyor.
# ---------------------------------------------------------------------------
