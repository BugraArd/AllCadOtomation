# Anahtarlamali buck converter - yerlesim kurallari
#
# Kaynak: docs/tasarim-kurallari/01-anahtarlamali-guc.md
# Sayisal esiklerin cogu ROHM 66AN015E kontrol listesinden gelir; TI/ADI/Richtek
# app-note'lari bu konuda mm vermiyor ("as close as possible" diyorlar).
#
# YERLESIM KURALLARI UYARLAMA GEREKTIRMEZ. `buck_layout` bilesenleri NET
# ADINDAN degil TOPOLOJIDEN buluyor: regulatorun SW pini + o nette bir induktor.
# Gercek kartlarda net adlari yardim etmiyor - KiCad geri besleme netini
# "Net-(U2-FB{slash}VSET)" diye adlandiriyor ve hicbir desen tutmuyor.
# Yalnizca guc izi kurallari (asagida) kendi net adlarinizi istiyor.
#
#   include:
#     - presets/buck.rules.yaml
#
# TOPOLOJI UYARISI: bu kurallar BUCK icindir. Boost'ta giris kondansatoru
# kesikli akim tasimaz; TI SLVA773 boost'ta VIN bakirinin buyuk olmasinin
# sorun yaratmadigini soyler. Boost'ta kritik olan CIKIS kondansatorudur.
# Tanima buck-boost'u ayri isaretler ve orada cikis netini iddia etmez.

version: 1

defaults:
  severity: warning
  ignore_nets: ["GND", "AGND", "DGND", "PGND", "/GND"]

rules:
  # --- Yerlesim: ROHM 66AN015E kontrol listesi -----------------------------
  # Tek kural, TESPIT EDILEN rollere karsi calisir. Mesafeler AYNI NETTEKI
  # PINLER arasinda olculur - bilesen merkezini kullanmak yaniltici olurdu,
  # SOIC-16'da bir pin merkeze 5 mm uzakta olabilir ve esikler 3-4 mm.
  #
  # Her esik istege baglidir; tespit edilemeyen rol SESSIZCE atlanir.
  - id: buck-yerlesim
    type: buck_layout
    severity: error
    description: "Anahtarlamali regulator yerlesimi (ROHM 66AN015E kontrol listesi)"
    weight: 18   # olculmus etki: TI AN-2155 sicak dongu deneyi bu mesafelere bagli
    cin_max_mm: 3.0        # Oncelik 1: CIN'in VIN+PGND yolu toplam < 6 mm
    sw_max_mm: 4.0         # Oncelik 2: IC -> L izi <= 4 mm
    cout_max_mm: 4.0       # Oncelik 3: COUT -> L <= 4 mm
    fb_max_mm: 4.0         # #4-2: FB bolucu FB pinine <= 4 mm
    sw_area_max_mm2: 100   # Oncelik 2: SW bakir alani <= 100 mm2
    #
    # Giris sicak dongusu - projedeki EN GUCLU sayisal kanit. TI AN-2155 bunu
    # gercekten OLCTU (LM3102, 1 MHz, 12V->3.3V/2.5A, CISPR-22 Class B, 3 m):
    #     6 mm2  -> SW spike 2.5 V, Class B marji 8.3 dB
    #    12 mm2  -> 4.2 V, 7.8 dB
    #    18 mm2  -> 6.1 V, 6.7 dB
    # Esik 6 mm2: TI'in "iyi" konfigurasyonu. Olculdu - uc gercek kart da
    # rahatca geciyor (0.73 / 0.85 / 1.13 mm2), cunku modern entegre
    # regulatorlerde kondansator IC'ye bitisik.
    #
    # Dongu ENTEGRE regulator varsayar: CIN.VIN -> IC.VIN -> IC.GND -> CIN.GND.
    # Harici FET'li ayrik tasarimlarda dongu FET'lerin uzerinden gecer ve bu
    # olcum yanlis olur; tanima harici FET'i gormedigi icin oyle bir kart
    # "entegre" gibi gorunur. Bilinen sinir.
    hot_loop_max_mm2: 6.0
    #
    # fb_inductor_min_mm BILEREK VERILMEDI. ROHM #4-1 "FB izi induktorden
    # >= 10 mm" diyor ama bu, AYNI LISTEDEKI diger iki esikle CELISIYOR:
    #
    #   FB direnci IC'nin FB pinine    <= 4 mm   (#4-2)
    #   Induktor  IC'nin SW pinine     <= 4 mm   (Oncelik 2)
    #   => ucgen esitsizligi: FB<->L <= 4 + (IC ici SW-FB pin ayrimi) + 4
    #
    # Modern kucuk paketlerde pin ayrimi 1-2 mm. OLCULDU:
    #   One-Air-Max U6 (TPS62902): ayrim 1.20 mm -> ust sinir 9.20 mm
    #   One-Air-Max U2:            ayrim 1.19 mm -> ust sinir 9.19 mm
    #   CM5_MINIMA  U702:          ayrim 2.06 mm -> ust sinir 10.06 mm
    #
    # Ilk ikisinde 10 mm MATEMATIKSEL OLARAK SAGLANAMAZ. Uc gercek kartin
    # ucunde de, sekiz FB direncinin sekizinde de ihlal cikiyordu (5.9-8.9 mm).
    # ROHM'un listesi buyuk ayrik tasarimlari varsayiyor olmali.
    #
    # Buyuk paket kullaniyorsaniz acabilirsiniz:
    #   fb_inductor_min_mm: 10.0

  # Serbest gecis diyodu bir ROL olarak taninmiyor (senkron regulatorlerde
  # zaten yok), bu yuzden ayri kural olarak kaldi.
  - id: buck-fb-diyottan-uzak
    type: keep_apart
    description: "Geri besleme bilesenleri serbest gecis diyodundan uzak olmali (ROHM: >= 10 mm)"
    weight: 8   # ROHM 66AN015E #4-1 (sayisal), ikincil yol
    a:
      kind: resistor
    # Net filtresi kesinlik icin sart: filtresiz kural KARTTAKI HER DIRENCI
    # her diyotla karsilastiriyor (One-Air-Max'te 10 yanlis bulgu uretmisti).
    a_on_net: "^(FB|VFB|VSENSE)$"
    b:
      kind: diode
    min_distance_mm: 10.0
    max_findings: 10

  # --- Guc izleri: akima gore genislik ------------------------------------
  # Bunlar net ADINA bakar; kendi tasariminiza gore duzenleyin.
  #
  # current_a'yi KENDI tasariminiza gore ayarlayin - varsayilan 2 A yalnizca
  # bir ornek. Yontem secimi (dokuman 1.7'deki 3.3x yayilim):
  #   ipc2221    (varsayilan) 2 A / 1 oz / 10 C -> 0.78 mm
  #   mm_per_amp (ROHM)       2 A / 1 oz        -> 2.00 mm
  - id: buck-guc-izi-genisligi
    type: trace_width
    severity: error
    description: "Guc izleri akimi tasiyacak genislikte olmali (IPC-2221B)"
    weight: 12   # IPC-2221B formulu - surekli iliski, olceklenir
    scale: true
    net: "^(VIN|PVIN|SW|PH|LX|VOUT|VO)$"
    current_a: 2.0
    delta_t_c: 10
    copper_oz: 1.0
    method: ipc2221

  # TI SLVA773: guc yolunda amper basina 1 via. Via kapasitesi TI SLVA959B
  # Tablo 3-1'den (IPC-2221'in namlu hesabindan ~2 kat muhafazakar).
  - id: buck-guc-via-sayisi
    type: via_current
    description: "Guc yolunda katman degistiren via'lar akimi tasimali (TI: ~1 via/A)"
    weight: 10   # TI SLVA959B Tablo 3-1 - surekli iliski, olceklenir
    scale: true
    net: "^(VIN|PVIN|SW|PH|LX|VOUT|VO)$"
    current_a: 2.0

  # --- FB bolucu degeri (KAPALI - beyan gerektirir) -------------------------
  # Richtek AN033: bolucuden gecen akim, FB pininin bias akiminin en az 100
  # KATI olmali; yoksa bias akimi cikis gerilimini kaydirir.
  #   I_bolucu = Vfb / R2 >= 100 * I_bias  ->  R2 <= Vfb / (100 * I_bias)
  #
  # Vfb ve bias akimi REGULATORUN datasheet degerleridir, tasarim dosyasinda
  # yoktur. Kendi parcaniza gore girip acin.
  #
  # - id: buck-fb-bolucu-degeri
  #   type: component_value
  #   severity: warning
  #   description: "FB bolucu akimi bias akiminin >= 100 kati olmali (Richtek AN033)"
  #   weight: 10
  #   select: { kind: resistor }
  #   on_net: "^(FB|VFB|VSENSE)$"
  #   check: fb_divider
  #   params:
  #     vfb: 0.8                # regulatorun FB referans gerilimi
  #     bias_current_na: 100    # FB pin bias akimi (datasheet)

# ---------------------------------------------------------------------------
# BU MOTORLA OLCULEMEYENLER (arastirmada sayisal degeri var, kural yok)
#
#   - Sicak dongu alani AYRIK tasarimlarda (harici FET'ler). Entegre
#     regulatorlerde olculuyor (hot_loop_max_mm2) cunku akim IC'ye VIN'den
#     girip GND'den cikiyor ve anahtarlarin IC ICI baglantisini bilmeye gerek
#     kalmiyor. Harici FET'li tasarimda dongu FET'lerin uzerinden gecer;
#     tanima harici FET'i gormedigi icin oyle bir kart yanlislikla "entegre"
#     sayilir ve olcum yanlis olur.
#   - Induktor altinda bakir olmamasi (ROHM, >= 3 mm temizlik). Zone poligonu
#     ile bilesen courtyard'inin KESISIMI gerekir; copper_area yalnizca toplam
#     alani olcer, nerede oldugunu degil.
#   - CIN GND ile COUT GND arasi >= 10 mm (ROHM). Kondansatorun HANGI pininin
#     GND oldugunu ayirt etmek gerekir.
#   - Termal via sayisi/araligi (TI SLMA002J: 5-9 via, ~1.2 mm aralik).
# ---------------------------------------------------------------------------
