# Harici guc girisi (USB'siz kartlar icin): 2 pinli header, 5 V + GND.
#
# `guc-vbus` yetenegini USB konnektoru yerine bu blok da saglayabilir.
# Ikisi birden niyette olursa plan not duser (ayni agi iki kaynak surer) -
# gercek kartlarda mesru (USB + harici besleme) ama bilincli secilmeli.

version: 1
id: guc-girisi-header
description: "2 pinli guc girisi header'i (5V/VBUS + GND)"

provides: [guc-vbus]
requires: []

params:
  vin: "VBUS"
  gnd: "GND"
  # Deger alani (kartta/BOM'da gorunen etiket). 5 V disi girislerde
  # yaniltici olmasin diye parametre (Kicad-ecd: 12 V bolucu referansi).
  etiket: GUC-5V

components:
  - name: header
    lib_id: Connector_Generic:Conn_01x02
    value: "${etiket}"
    footprint: Connector_PinHeader_2.54mm:PinHeader_1x02_P2.54mm_Vertical
    connect:
      "#1": "${vin}"
      "#2": "${gnd}"
