version: 1

# ---------------------------------------------------------------------------
# pcbqa varsayilan kurallari
#
# Bu dosya bir baslangic noktasidir - kendi projenize gore degistirin.
# Calisma dizininde "rules.yaml" varsa pcbqa onu tercih eder, ya da
# --rules ile dosya yolu verebilirsiniz.
#
# Kural tipleri:
#   proximity          bir pine, ayni netteki belirli bir bilesen N mm'den yakin olmali
#   require_on_net     ada uyan her nette belirli turde bir bilesen bulunmali
#   same_net           belirtilen pinler ayni nette olmali (dogrudan niyet kontrolu)
#   net_length         netin tahmini uzunlugu (HPWL) butceyi asmamali
#   length_match       bir grup netin uzunlugu birbirine yakin olmali (diferansiyel cift)
#   courtyard_overlap  bilesenler cakismamali, aralarinda montaj boslugu olmali
#   edge_clearance     bilesenler kart kenarindan yeterince iceride olmali
#   keep_apart         iki bilesen kumesi arasinda EN AZ N mm olmali
#
# Asagidakiler yalnizca YONLENDIRILMIS kartlarda olcum yapar; yerlestirme
# asamasinda (kartta bakir yokken) sessizce atlanirlar:
#   trace_width        iz genisligi akimi tasimaya yetmeli (IPC-2221B)
#   via_current        netteki via'lar toplu olarak akimi tasimali
#   clearance_voltage  iki net arasi bakir acikligi gerilim farkina yetmeli
#
# Devre tipine gore hazir esikler icin pcbqa/presets/ altina bakin; kendi kural
# dosyanizdan `include:` ile dahil edebilirsiniz.
#
# Secici alanlari (pin / partner):
#   ref        referans uzerinde duzenli ifade      -> "^U"
#   kind       bilesen turu                          -> ic, capacitor, resistor,
#                                                        inductor, diode, transistor,
#                                                        crystal, connector, switch,
#                                                        fuse, testpoint, other
#   value      deger uzerinde duzenli ifade          -> "100n"
#   pintype    KiCad pin tipi (sadece pin secicide)  -> power_in, input, output,
#                                                        bidirectional, passive, ...
#   function   pin adi uzerinde duzenli ifade        -> "V(CC|DD)"
# ---------------------------------------------------------------------------

defaults:
  severity: warning
  # Toprak/genis netlerde mesafe ve uzunluk olcumu anlamli degil (poligon dokum
  # yapilir), bu yuzden tum kurallarda atlanir.
  ignore_nets:
    - "GND"
    - "AGND"
    - "DGND"
    - "GNDA"
    - "GNDD"
    - "GNDPWR"
    - "/GND"
    - "earth"

rules:
  # --- 1) Decoupling kondansatoru yakinligi ---------------------------------
  # Her IC guc pininin yakininda, AYNI NETTE bir kondansator olmali.
  # KiCad'in ERC'si bunu kontrol etmez: sematikte kondansator bagli gorunur,
  # ama PCB'de 40 mm oteye konmus olabilir.
  #
  # exclusive: her partner en fazla bir pine sayilir. Kapali olsaydi 3V3 gibi
  # genis bir rayda TEK bir kondansator butun guc pinlerini "tatmin eder" ve
  # eksik decoupling gorunmez olurdu. Eski tasarimlarda cok bulgu uretebilir;
  # kademeli gecis icin once false ile deneyin.
  - id: decoupling-mesafe
    type: proximity
    severity: error
    description: "Her IC guc pininin yakininda kendi decoupling kondansatoru olmali"
    pin:
      kind: ic
      pintype: power_in
    partner:
      kind: capacitor
    max_distance_mm: 10
    require_partner: true
    exclusive: false

  # --- 2) Veri hatlarinda pull-up ------------------------------------------
  # I2C / acik-kollektor hatlarinda direnc bekleriz.
  - id: veri-hatti-pullup
    type: require_on_net
    severity: warning
    description: "I2C / veri hatlarinda pull-up direnci bekleniyor"
    net: "(SDA|SCL|I2C|CLOCK|DATA)"
    partner:
      kind: resistor

  # --- 3) Net uzunluk butcesi ----------------------------------------------
  # HPWL = netin tum pinlerini saran dikdortgenin yari cevresi.
  # Yonlendirme oncesi bakir uzunlugu icin hizli ve yeterince dogru tahmin.
  # Bu deger, Asama 3'te yerlestirme motorunun kucultecegi ana buyukluk.
  - id: net-uzunluk-butcesi
    type: net_length
    severity: warning
    description: "Netler asiri uzun degil (yerlestirme verimliligi gostergesi)"
    net: ".*"
    max_hpwl_mm: 120
    max_findings: 10

  # --- 4) Uretilebilirlik ---------------------------------------------------
  # KiCad'in kendi DRC'sinde de "courtyards_overlap" kontrolu var, ama PROJE
  # AYARLARINDAN KAPATILABILIYOR (KiCad'in stickhub demosunda kapali). Bu kural
  # o kontrolden bagimsiz calisir. Bilerek cakistirilan tasarimlar oldugu icin
  # varsayilan siddet "warning"; kritik oldugu projelerde "error" yapin.
  - id: courtyard-cakisma
    type: courtyard_overlap
    severity: warning
    description: "Bilesenler cakismamali, aralarinda montaj boslugu olmali"
    clearance_mm: 0.0

  # Konnektorler ve montaj delikleri cogu zaman KASITLI olarak kenardadir,
  # bu yuzden varsayilan olarak muaf tutulurlar.
  - id: kart-kenari-mesafesi
    type: edge_clearance
    severity: warning
    description: "Bilesenler kart kenarindan yeterince iceride olmali"
    min_distance_mm: 0.5
    ignore_refs: ["^J", "^P", "^CON", "^MH", "^H\\d", "^SW", "^TP"]
    max_findings: 15

  # --- 5) Projeye ozel ornekler (kapali) ------------------------------------
  # Asagidakiler referans/net adlarina bagli oldugu icin varsayilan dosyada
  # kapali. Kendi projenizde acin:
  #
  # - id: guc-raylari-ortak
  #   type: same_net
  #   severity: error
  #   description: "Tum sayisal IC'ler ayni VCC rayindan beslenmeli"
  #   pins: ["U1.8", "U5.14", "U6.1"]
  #
  # - id: usb-diferansiyel-cift
  #   type: length_match
  #   severity: error
  #   description: "Diferansiyel cift dengeli yerlestirilmeli"
  #   groups:
  #     - ["USB_DP", "USB_DM"]
  #   tolerance_mm: 3

  # --- 6) "Uzak dursun" kurallari (kapali) ---------------------------------
  # Bunlar `proximity`nin TERSIDIR ve kolay atlanir: kural kaynaklarinin
  # sasirtici bir kismi "yaklastir" degil "uzaklastir" der. Ornek (TI SNOA986A):
  # I2C pull-up direncleri sicaklik sensorune 10 mm'den yakin olursa kendi
  # oz-isinmalari olcumu bozar.
  #
  # Yerlestirici bu kurallara tepki verir - ayri bir ayar gerekmez; olculdu,
  # bkz. tests/test_placement_keep_apart.py.
  #
  # - id: pullup-sicaklik-sensorunden-uzak
  #   type: keep_apart
  #   severity: error
  #   description: "I2C pull-up direncleri sicaklik sensorunden >= 10 mm (TI SNOA986A)"
  #   a: { kind: resistor }
  #   b: { kind: ic, ref: "^(TMP|TEMP)" }
  #   min_distance_mm: 10.0

  # --- 7) Bakir kurallari (kapali - yonlendirilmis kart gerektirir) ---------
  # `current_a` degerini KENDI tasariminiza gore verin; varsayilan yoktur.
  #
  # - id: guc-izi-genisligi
  #   type: trace_width
  #   severity: error
  #   description: "Guc izleri akimi tasiyacak genislikte olmali (IPC-2221B)"
  #   net: "^(VIN|VBUS|VOUT)$"
  #   current_a: 2.0
  #   delta_t_c: 10          # varsayilan 10 C sicaklik artisi
  #   copper_oz: 1.0
  #   method: ipc2221        # ya da mm_per_amp (ROHM'un 1 mm/A pratik kurali)
